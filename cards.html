<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>Red🔥 · การ์ดคำ A4 (14 ใบ)</title>
<style>
@font-face{font-family:'Kanit';font-weight:700;src:url(kanit-700.woff2) format('woff2');}
@page{size:A4 landscape;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:"Kanit","Thonburi",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:297mm;height:210mm;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;page-break-after:always;break-after:page}
.pg:last-child{page-break-after:auto;break-after:auto}
.top{position:absolute;top:10mm;left:0;right:0;text-align:center;font-size:20pt;letter-spacing:3px;opacity:.9}
.w{font-weight:700;line-height:1.25;white-space:nowrap;text-shadow:0 2mm 0 rgba(0,0,0,.25)}
.who{position:absolute;bottom:10mm;left:0;right:0;text-align:center;font-size:26pt;opacity:.95}
.no{position:absolute;bottom:9mm;right:12mm;font-size:16pt;opacity:.8}
</style></head><body>
<script>
const P=[
["01","แซนดี้","Red",["#ff4d4d","#ff9a3c"]],
["02","แอ้","Red",["#c8102e","#ff5f6d"]],
["03","เบส 🐷","ไฟลุก",["#ff7eb3","#ff3d6e"]],
["04","Eh 59365","แรงฤทธิ์",["#ffb347","#ff6a00"]],
["05","ice SuwatL","ชิตทุกใจ",["#4facfe","#00c6fb"]],
["06","อุ๋งอิ๋ง","สิบสี่",["#a18cd1","#fbc2eb"]],
["07","Maapandi","คน",["#8e2de2","#c471ed"]],
["08","Matthew","บิน",["#43cea2","#185a9d"]],
["09","แนน","ไป",["#56ab2f","#a8e063"]],
["10","อาร์ม 🐋","ด้วยกัน",["#2193b0","#6dd5ed"]],
["11","ปาลวัฒน์","ไม่มี",["#232526","#606c88"]],
["12","กอล์ฟ","ใคร",["#06c755","#00a040"]],
["13","สาม","ทิ้ง",["#7f00ff","#00d2ff"]],
["14","ยอด","ใคร",["#0f2b5b","#2a5298"]]];

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.write(P.map((p,i)=>`<section class="pg" style="background:linear-gradient(135deg,${p[3][0]},${p[3][1]})">
<div class="top">SEAT ${p[0]} · RED🔥</div><div class="w">${esc(p[2])}</div><div class="who">${esc(p[1])}</div><div class="no">${i+1} / 14</div></section>`).join(""));
function fit(){document.querySelectorAll(".w").forEach(w=>{const W=1122*0.86,H=794*0.6;let lo=20,hi=900;
 while(hi-lo>2){const m=(lo+hi)/2;w.style.fontSize=m+"px";(w.scrollWidth<=W&&w.scrollHeight<=H)?lo=m:hi=m;}w.style.fontSize=lo+"px";});}
fit();document.fonts.ready.then(fit);
</script></body></html>
