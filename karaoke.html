<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#6E0410">
<link rel="icon" href="favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="favicon.png">
<title>คาราโอเกะ · Red Red ไฟลุก</title>
<style>
@font-face{font-family:'Kanit';font-weight:700;font-display:swap;src:url(kanit-700.woff2) format('woff2');}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:#fff;font-family:"Kanit","Thonburi","Noto Sans Thai",system-ui,sans-serif;-webkit-user-select:none;user-select:none;
 background:radial-gradient(ellipse at 50% 120%,#ff5a1f 0%,#c10d22 35%,#6E0410 75%,#3a0209 100%) fixed #3a0209}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 5vw calc(env(safe-area-inset-bottom) + 14px)}
h1{font-size:clamp(18px,4.6vw,28px);text-align:center;letter-spacing:1px}
h1 small{display:block;font-size:.6em;opacity:.75;letter-spacing:2px;font-weight:400}
#lines{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3.2vh;text-align:center;min-height:0}
.ln{transition:opacity .3s,transform .3s}
.ln .th{font-weight:700;line-height:1.3;font-size:clamp(26px,7.4vw,64px);color:rgba(255,255,255,.55);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.ln .ro{font-size:clamp(15px,4vw,30px);line-height:1.25;color:rgba(255,255,255,.55);margin-top:2px}
.ln span{transition:color .15s;display:inline-block;white-space:nowrap}.ln span+span{margin-left:.3em}
.ln .th span.sung{color:#FFC23D}.ln .ro span.sung{color:#FFE08A}
.ln.prev{opacity:.35;transform:scale(.86)}.ln.next{opacity:.5;transform:scale(.86)}
.ln.empty{visibility:hidden}
#bar{display:flex;align-items:center;gap:12px}
#play{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:#FFC23D;color:#6E0410;font-size:28px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer}
#play:active{transform:scale(.95)}
#seek{flex:1;accent-color:#FFC23D;height:28px}
#time{flex:none;font-size:15px;opacity:.85;min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(30,0,6,.55);z-index:5;cursor:pointer;text-align:center;padding:24px}
#gate b{font-size:clamp(26px,7vw,44px);background:#C8102E;border-radius:999px;padding:16px 34px;box-shadow:0 0 0 5px #FFC23D,0 12px 40px rgba(0,0,0,.5)}
#gate span{opacity:.85;font-size:16px}
</style></head><body>
<div id="app">
  <h1>Red Red ไฟลุก<small>KARAOKE · เที่ยวบิน RED🔥</small></h1>
  <div id="lines"><div class="ln prev"></div><div class="ln cur"></div><div class="ln next"></div></div>
  <div id="bar"><button id="play" aria-label="Play">▶</button><input id="seek" type="range" min="0" max="120" step="0.1" value="0"><div id="time">0:00 / 2:00</div></div>
</div>
<div id="gate"><b>▶ แตะเพื่อร้อง</b><span>ไทย + คำอ่านภาษาอังกฤษ · ไฮไลต์ตามเพลง</span></div>
<audio id="au" src="audio/theme.mp3" preload="auto" playsinline></audio>
<script>
"use strict";
// Same lyrics and timing as the karaoke bar in index.html
const LYRICS=[[0.0, 4.4, [["ติ๊งต่อง", "Ting-tong"], ["ผู้โดยสาร", "phu-doi-san"], ["โปรดทราบ", "prot sap"]]], [4.4, 8.2, [["เที่ยวบิน", "Thiao-bin"], ["Red", "Red"], ["พร้อม", "phrom"], ["ออกเดินทาง", "ok doen-thang"]]], [8.2, 12.5, [["แซนดี้", "Sandy"], ["ประกาศ", "pra-kat"], ["เสียงดัง", "siang dang"]]], [18.9, 22.7, [["ไม่มีดีเลย์", "Mai mi di-le"], ["มีแต่", "mi tae"], ["คนดีเลย", "khon di loei"]]], [22.7, 26.6, [["แอ้บอกว่า", "Ae bok wa"], ["ไม่มีใคร", "mai mi khrai"], ["เดินคนเดียว", "doen khon diao"]]], [26.6, 30.5, [["เบส", "Bes"], ["โทรตาม", "tho tam"], ["จนแบต", "chon baet"], ["หมดเลย", "mot loei"]]], [30.5, 34.0, [["เอ๊ะชี้ทาง", "Eh chi thang"], ["ชีวิตคือ", "chi-wit khue"], ["การเดินทาง", "kan doen-thang"]]], [34.0, 38.1, [["ไอซ์เย็นชา", "Ice yen-cha"], ["แค่ชื่อ", "khae chue"], ["ใจอุ่น", "chai un"], ["จริงจัง", "ching-chang"]]], [38.1, 43.2, [["Red Red", "Red Red"], ["ไฟลุก", "fai luk"], ["แรงฤทธิ์", "raeng rit"], ["ชิตทุกใจ", "chit thuk chai"]]], [43.2, 47.0, [["สิบสี่คน", "Sip-si khon"], ["บินไปด้วยกัน", "bin pai duai kan"], ["ไม่มีใคร", "mai mi khrai"], ["ทิ้งใคร", "thing khrai"]]], [47.0, 50.9, [["Red Red", "Red Red"], ["ไฟลุก", "fai luk"], ["หัวใจเรา", "hua-chai rao"], ["เป็นหนึ่งเดียว", "pen nueng diao"]]], [50.9, 53.6, [["Fasten seatbelt", "Fasten seatbelt"], ["เตรียมตัว", "triam tua"], ["สนุก", "sa-nuk"]]], [53.6, 56.4, [["ไปด้วยกัน", "Pai duai kan"], ["ทั้งลำ", "thang lam"]]], [56.4, 60.0, [["อุ๋งอิ๋ง", "Ung-Ing"], ["ถามลงยัง", "tham long yang"]]], [60.0, 63.4, [["ยังไม่ทัน", "Yang mai than"], ["ได้ออกตัว", "dai ok tua"], ["Maapandi", "Maapandi"]]], [63.4, 66.4, [["ปั่นจักรยาน", "Pan chak-kra-yan"], ["Simple", "simple"], ["แต่ไม่ธรรมดา", "tae mai tham-ma-da"]]], [66.4, 69.9, [["แมทธิว", "Matthew"], ["น้ำตาซึม", "nam-ta suem"], ["ซึ้งที่ได้", "sueng thi dai"], ["บินด้วยกัน", "bin duai kan"]]], [69.9, 75.4, [["แนนพกต้นไม้มา", "Naen phok ton-mai ma"], ["อาร์ม", "Arm"], ["วาฬตัวใหญ่", "wan tua yai"], ["ขอที่วางกระเป๋า", "kho thi wang kra-pao"]]], [75.4, 80.3, [["ปาลวัฒน์", "Palawat"], ["เงียบเหมือนนินจา", "ngiap muean ninja"], ["กอล์ฟ", "Golf"]]], [80.3, 82.3, [["ตอบไลน์ช้า", "Top LINE cha"], ["ขอโทษที", "kho-thot thi"]]], [82.3, 85.3, [["สามชี้ฟ้า", "Sam chi fa"], ["To infinity", "to infinity"]]], [85.3, 88.3, [["ยอดดูแล", "Yot du-lae"], ["ทั้งห้องโดยสาร", "thang hong doi-san"]]], [88.3, 92.3, [["ทุกคน", "Thuk khon"], ["ปลอดภัย", "plot-phai"], ["ถึงที่หมาย", "thueng thi mai"]]], [92.3, 96.6, [["Red Red", "Red Red"], ["ไฟลุก", "fai luk"], ["แรงฤทธิ์", "raeng rit"], ["ชิตทุกใจ", "chit thuk chai"]]], [97.4, 101.2, [["สิบสี่คน", "Sip-si khon"], ["บินไปด้วยกัน", "bin pai duai kan"], ["ไม่มีใคร", "mai mi khrai"], ["ทิ้งใคร", "thing khrai"]]], [101.2, 105.1, [["Red Red", "Red Red"], ["ไฟลุก", "fai luk"], ["หัวใจเรา", "hua-chai rao"], ["เป็นหนึ่งเดียว", "pen nueng diao"]]], [105.1, 107.8, [["Fasten seatbelt", "Fasten seatbelt"], ["เตรียมตัว", "triam tua"], ["สนุก", "sa-nuk"]]], [107.8, 110.6, [["ไปด้วยกัน", "Pai duai kan"], ["ทั้งลำ", "thang lam"]]], [110.2, 115.5, [["ขอบคุณที่บิน", "Khop-khun thi bin"], ["กับ Red", "kap Red"], ["ใครหลับอยู่", "khrai lap yu"], ["ตื่นได้แล้ว", "tuen dai laeo"]]]];
LYRICS.forEach(l=>{let tot=0;l[2].forEach(c=>tot+=c[0].length);let acc=0;l.at=l[2].map(c=>{const a=l[0]+(l[1]-l[0])*acc/tot;acc+=c[0].length;return a;});});
const au=document.getElementById("au"),seek=document.getElementById("seek"),play=document.getElementById("play"),[elP,elC,elN]=document.querySelectorAll(".ln");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fmt=t=>{t=Math.max(0,Math.floor(t));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");};
function fill(el,i){if(i<0||i>=LYRICS.length){el.classList.add("empty");el.dataset.i="";return;}el.classList.remove("empty");
  if(el.dataset.i===String(i))return;el.dataset.i=i;const l=LYRICS[i];
  el.innerHTML=`<div class="th">${l[2].map(c=>`<span>${esc(c[0])}</span>`).join("")}</div><div class="ro">${l[2].map(c=>`<span>${esc(c[1])}</span>`).join("")}</div>`;}
function idxAt(t){let i=-1;for(let j=0;j<LYRICS.length;j++)if(t>=LYRICS[j][0]-1.2)i=j;return i;}
let dragging=false;
function tick(){const t=au.currentTime||0;const i=Math.max(0,idxAt(t));fill(elP,i-1);fill(elC,i);fill(elN,i+1);
  const l=LYRICS[i],th=elC.querySelectorAll(".th span"),ro=elC.querySelectorAll(".ro span");
  l.at.forEach((a,j)=>{const s=t>=a;th[j]&&th[j].classList.toggle("sung",s);ro[j]&&ro[j].classList.toggle("sung",s);});
  if(!dragging)seek.value=t;document.getElementById("time").textContent=fmt(t)+" / "+fmt(au.duration||120);
  requestAnimationFrame(tick);}
function toggle(){if(au.paused){const p=au.play();if(p&&p.catch)p.catch(()=>{});}else au.pause();}
au.addEventListener("play",()=>play.textContent="❚❚");au.addEventListener("pause",()=>play.textContent="▶");
au.addEventListener("ended",()=>{play.textContent="↺";});
au.addEventListener("loadedmetadata",()=>seek.max=au.duration);
play.addEventListener("click",()=>{if(au.ended)au.currentTime=0;toggle();});
seek.addEventListener("input",()=>{dragging=true;au.currentTime=+seek.value;});seek.addEventListener("change",()=>dragging=false);
document.getElementById("gate").addEventListener("click",e=>{e.currentTarget.remove();au.currentTime=0;toggle();});
addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();toggle();}});
requestAnimationFrame(tick);
</script></body></html>
